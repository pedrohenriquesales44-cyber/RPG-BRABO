<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Revenge Of NPC</title>
<style>
    /* Remove as margens padrão do navegador e garante altura total */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      /* Substitua pelo caminho correto da sua imagem */
      background-image: url(SeiLá.gif); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /* Alinha o título exatamente no centro da tela */
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    h1 {
      color: #FF4500;             /* Cor do texto (mude se o fundo for muito claro) */
      font-family: sans-serif;
      font-size: 3rem;          /* Tamanho do texto */
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); /* Sombra para destacar o texto do fundo */
      margin: 0;
    }
  </style>
</head>

<body>
